name: Build Aether Mobile Ultra APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '34.0.0'
  PLATFORM_VERSION: 'android-34'
  TARGET_ABI: 'arm64-v8a'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # STEP 1: Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # STEP 2: Setup Java
      # ============================================================
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ============================================================
      # STEP 3: Setup Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "build-tools;${{ env.BUILD_TOOLS_VERSION }}" "cmake;${{ env.CMAKE_VERSION }}" "platforms;${{ env.PLATFORM_VERSION }}" "platform-tools"
        shell: bash

      # ============================================================
      # STEP 4: Detect, verify format and extract project archive
      # ============================================================
      - name: Detect and extract project archive
        run: |
          echo "=== Files in repo ==="
          ls -la

          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full p7zip-rar file

          ARCHIVE=""
          for f in Aether_Mobile_Ultra_GitHub.zip Aether_Mobile_Ultra_GitHub.7z projeto.zip *.zip *.7z; do
            if [ -f "$f" ]; then
              echo "Found candidate: $f (size: $(stat -c%s "$f" 2>/dev/null || echo 'unknown') bytes)"
              ARCHIVE="$f"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "No archive found. Assuming project is already extracted."
            exit 0
          fi

          echo "=== Checking real file type ==="
          file "$ARCHIVE"
          xxd -l 8 "$ARCHIVE" | head -1

          echo "=== Attempting extraction ==="
          EXTRACTED=0

          # Try 7z first (handles 7z, zip, rar, and fake extensions)
          echo "[TRY 1] 7z x -y $ARCHIVE"
          7z x -y "$ARCHIVE"
          if [ $? -eq 0 ]; then
            echo "[SUCCESS] 7z extracted successfully!"
            EXTRACTED=1
          else
            echo "[FAIL] 7z failed, trying unzip..."
            unzip -q -o "$ARCHIVE" 2>/tmp/unzip_err.log
            if [ $? -eq 0 ]; then
              echo "[SUCCESS] unzip worked!"
              EXTRACTED=1
            else
              echo "[FAIL] unzip failed:"
              cat /tmp/unzip_err.log | head -5
            fi
          fi

          if [ $EXTRACTED -eq 0 ]; then
            echo "ERROR: Could not extract archive with any method."
            exit 1
          fi

          echo "=== Structure after extraction ==="
          ls -la
          find . -maxdepth 2 -type d | head -30
        shell: bash

      # ============================================================
      # STEP 5: Locate Android project directory
      # ============================================================
      - name: Locate Android project directory
        id: locate
        run: |
          PROJECT_DIR=""
          for d in . Aether Aether_Mobile_Ultra android; do
            if [ -f "$d/app/build.gradle" ] || [ -f "$d/app/build.gradle.kts" ]; then
              PROJECT_DIR="$d"
              echo "Android project found at: $PROJECT_DIR"
              break
            fi
          done
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -maxdepth 3 -type f -name "build.gradle" -o -name "build.gradle.kts" | grep "/app/" | head -1 | xargs dirname 2>/dev/null | xargs dirname 2>/dev/null || echo "")
          fi
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Using root as Android project"
            PROJECT_DIR="."
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory set to: $PROJECT_DIR"
        shell: bash

      # ============================================================
      # STEP 6: Fix Gradle wrapper
      # ============================================================
      - name: Fix Gradle wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "=== Checking for existing wrapper ==="
          ls -la gradle/wrapper/ 2>/dev/null || echo "No wrapper directory"
          cat gradle/wrapper/gradle-wrapper.properties 2>/dev/null || echo "No gradle-wrapper.properties"

          if [ -f "gradlew" ]; then
            echo "gradlew already exists. Fixing version..."
            sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.2-bin.zip|' gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.2-all.zip|' gradle/wrapper/gradle-wrapper.properties || true
            cat gradle/wrapper/gradle-wrapper.properties
            exit 0
          fi

          echo "No gradlew found. Downloading Gradle and creating wrapper..."
          curl -sL -o /tmp/gradle-8.2-bin.zip "https://services.gradle.org/distributions/gradle-8.2-bin.zip"
          unzip -q -o /tmp/gradle-8.2-bin.zip -d /tmp/
          GRADLE_BIN="/tmp/gradle-8.2/bin/gradle"

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "rootProject.name = 'AetherProject'" > settings.gradle
          fi

          "$GRADLE_BIN" wrapper --gradle-version 8.2 --distribution-type bin
          ls -la gradlew
          cat gradle/wrapper/gradle-wrapper.properties
        shell: bash

      # ============================================================
      # STEP 7: Fix build.gradle syntax for AGP 8.x
      # ============================================================
      - name: Fix build.gradle syntax
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          BUILD_FILE="app/build.gradle"
          if [ ! -f "$BUILD_FILE" ]; then
            BUILD_FILE="app/build.gradle.kts"
          fi
          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle not found!"
            find . -name "build.gradle*" -type f | head -10
            exit 1
          fi

          echo "=== Original build.gradle (first 80 lines) ==="
          head -n 80 "$BUILD_FILE"

          if ! grep -q "namespace" "$BUILD_FILE"; then
            echo "Adding namespace..."
            APP_ID=$(grep -oP "applicationId\s+\"\K[^\"]+" "$BUILD_FILE" | head -1 || echo "com.aether.mobile")
            sed -i "s/android\s*{/android {\n    namespace '${APP_ID}'/" "$BUILD_FILE"
          fi

          sed -i 's/compileSdkVersion/compileSdk/g' "$BUILD_FILE"
          sed -i 's/minSdkVersion/minSdk/g' "$BUILD_FILE"
          sed -i 's/targetSdkVersion/targetSdk/g' "$BUILD_FILE"

          echo "=== Fixed build.gradle (first 80 lines) ==="
          head -n 80 "$BUILD_FILE"
        shell: bash

      # ============================================================
      # STEP 8: Fix CMakeLists.txt (Vulkan compatibility)
      # ============================================================
      - name: Fix CMakeLists.txt
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          for cmakefile in $(find . -name "CMakeLists.txt" -not -path "*/.cxx/*" -not -path "*/build/*"); do
            echo "Processing: $cmakefile"
            sed -i 's/find_package(Vulkan REQUIRED)/find_library(VULKAN_LIB vulkan)\nif(NOT VULKAN_LIB)\n  message(FATAL_ERROR "Vulkan library not found")\nendif()/' "$cmakefile" 2>/dev/null || true
            sed -i 's/Vulkan::Vulkan/${VULKAN_LIB}/g' "$cmakefile" 2>/dev/null || true
          done
        shell: bash

      # ============================================================
      # STEP 9: Create local.properties
      # ============================================================
      - name: Create local.properties
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$NDK_PATH" >> local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/${{ env.CMAKE_VERSION }}" >> local.properties
          echo "=== local.properties ==="
          cat local.properties
        shell: bash

      # ============================================================
      # STEP 10: Create debug keystore
      # ============================================================
      - name: Create debug keystore
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkeypair -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        shell: bash

      # ============================================================
      # STEP 11: Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug -Pandroid.injected.build.abi=${{ env.TARGET_ABI }} --stacktrace --info --no-daemon
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # ============================================================
      # STEP 12: Build Release APK
      # ============================================================
      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ./gradlew assembleRelease -Pandroid.injected.build.abi=${{ env.TARGET_ABI }} --no-daemon
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      # ============================================================
      # STEP 13: Find APKs
      # ============================================================
      - name: Find APKs
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          echo "=== Searching for APKs ==="
          find . -name "*.apk" -type f | while read apk; do
            ls -lh "$apk"
            echo "APK: $apk"
          done
        shell: bash

      # ============================================================
      # STEP 14: Upload Debug APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-debug-apk
          path: ${{ steps.locate.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk

      # ============================================================
      # STEP 15: Upload Release APK
      # ============================================================
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-release-apk
          path: ${{ steps.locate.outputs.project_dir }}/**/build/outputs/apk/release/*.apk
          
