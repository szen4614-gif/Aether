name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0"
      - name: Extrair projeto
                run: unzip -o Aether_Mobile_Ultra_GitHub.zip || unzip -o Aether_Mobile_Ultra_GitHub.7z
      - name: Compilar APK
        run: ./scripts/build_android.sh --config release --abi arm64-v8a
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-apk
          path: build/android-*/**/*.a
