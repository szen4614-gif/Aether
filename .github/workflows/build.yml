name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Setup NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;26.1.10909125" "build-tools;34.0.0"
      - name: Instalar 7z
        run: sudo apt-get update -qq && sudo apt-get install -y p7zip-full
      - name: Extrair projeto
        run: |
          ls -la
          (unzip -o Aether_Mobile_Ultra_GitHub.zip || unzip -o Aether_Mobile_Ultra_GitHub.7z || unzip -o Aether_Mobile_Ultra_GitHub.pack || unzip -o projeto.zip || 7z x -y Aether_Mobile_Ultra_GitHub.zip || 7z x -y Aether_Mobile_Ultra_GitHub.7z || 7z x -y Aether_Mobile_Ultra_GitHub.pack || 7z x -y projeto.zip)
          echo "=== RESULTADO ==="
          ls -la
      - name: Compilar APK
        run: ./scripts/build_android.sh --config release --abi arm64-v8a
      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: aether-apk
          path: build/android-*/**/*.apk
          
