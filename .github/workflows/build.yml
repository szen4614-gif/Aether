name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Prepare NEXORA project
        shell: bash
        run: |
          set -e

          echo "=== CURRENT DIRECTORY ==="
          pwd

          echo
          echo "=== ROOT FILES ==="
          ls -lah

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Android project already exists at repository root."
            exit 0
          fi

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -name "nexora-minecraft-launcher-mvp-0.6.0*.zip" \
            -o -name "nexora*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: NEXORA ZIP not found."
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using NEXORA archive:"
          echo "$ZIP_FILE"

          rm -rf _nexora_extract
          mkdir -p _nexora_extract

          unzip -q "$ZIP_FILE" -d _nexora_extract

          SETTINGS_FILE=$(find _nexora_extract -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) was not found inside the NEXORA archive."
            find _nexora_extract -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "Project root:"
          echo "$PROJECT_ROOT"

          cp -a "$PROJECT_ROOT"/. .

          echo
          echo "=== PROJECT ROOT ==="
          ls -lah

      - name: Make scripts executable
        run: |
          find tools -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "=== PROJECT ==="
          pwd
          ls -lah

          echo
          echo "=== ANDROID MODULES ==="
          find . -maxdepth 4 -name "build.gradle.kts" -print
          find . -maxdepth 4 -name "build.gradle" -print

          echo
          echo "=== SETTINGS ==="
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          elif [ -f settings.gradle ]; then
            cat settings.gradle
          else
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          echo
          echo "=== VERIFICATION MODULE ==="
          if [ -d android-java-verification ]; then
            find android-java-verification -maxdepth 5 -type f | sort
          else
            echo "ERROR: android-java-verification module not found"
            exit 1
          fi

      - name: Fix Android JNI compatibility
        shell: bash
        run: |
          set -e

          FILE="android-java-verification/src/main/cpp/verification_bridge.cpp"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: verification_bridge.cpp not found"
            exit 1
          fi

          echo "Checking JNI_VERSION_1_8..."

          if grep -q "JNI_VERSION_1_8" "$FILE"; then
            sed -i 's/JNI_VERSION_1_8/0x00010008/g' "$FILE"
            echo "JNI_VERSION_1_8 replaced with JNI 1.8 numeric constant."
          else
            echo "No JNI_VERSION_1_8 occurrence found."
          fi

          echo
          echo "=== JNI VM INITIALIZATION LINE ==="
          grep -n "vmArgs.version" "$FILE" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build verification APK
        run: |
          gradle :android-java-verification:assembleDebug --no-daemon

      - name: Show generated APK
        run: |
          echo "=== GENERATED APK ==="
          find android-java-verification/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-java-verification-0.6.0
          path: android-java-verification/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload production launcher APK if generated
        uses: actions/upload-artifact@v4
        with:
          name: nexora-launcher-0.6.0
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
