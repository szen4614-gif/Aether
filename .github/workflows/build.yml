name: Build NOVA N10

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-n10-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.9"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "28.0.13004108"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build NOVA N10 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Locate and extract NOVA N10 source
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            PROJECT_DIR="$(pwd)"
          else
            ZIP=""

            if [ -f "./NOVA_N10_VALIDATION_UPGRADED.zip" ]; then
              ZIP="./NOVA_N10_VALIDATION_UPGRADED.zip"
            else
              ZIP="$(find . -maxdepth 4 -type f \
                \( \
                  -iname 'NOVA_N10_VALIDATION_UPGRADED.zip' \
                  -o -iname 'NOVA_N10*.zip' \
                  -o -iname 'N10*.zip' \
                \) \
                | head -n 1)"
            fi

            if [ -z "${ZIP}" ]; then
              echo "::error::NOVA N10 ZIP não encontrado."
              find . -type f -iname "*.zip" -print
              exit 1
            fi

            echo "ZIP selecionado:"
            echo "${ZIP}"

            rm -rf .nova_n10_source
            mkdir -p .nova_n10_source

            unzip -q "${ZIP}" -d .nova_n10_source

            PROJECT_SETTINGS="$(find .nova_n10_source \
              -type f \
              \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
              | head -n 1)"

            if [ -z "${PROJECT_SETTINGS}" ]; then
              echo "::error::settings.gradle(.kts) não encontrado após extração."

              echo "Arquivos extraídos:"
              find .nova_n10_source -maxdepth 6 -type f | sort

              exit 1
            fi

            PROJECT_DIR="$(dirname "${PROJECT_SETTINGS}")"
          fi

          PROJECT_DIR="$(cd "${PROJECT_DIR}" && pwd)"

          echo "NOVA_N10_PROJECT=${PROJECT_DIR}" >> "${GITHUB_ENV}"

          echo "Projeto:"
          echo "${PROJECT_DIR}"

          echo "settings:"
          find "${PROJECT_DIR}" \
            -maxdepth 1 \
            -type f \
            -name 'settings.gradle*' \
            -print

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      - name: Detect Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "${SDKMANAGER}" ]; then
            for ROOT in \
              "${ANDROID_HOME:-}" \
              "${ANDROID_SDK_ROOT:-}" \
              "/opt/android-sdk" \
              "${HOME}/Android/Sdk"
            do
              if [ -n "${ROOT}" ] && [ -x "${ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
                SDKMANAGER="${ROOT}/cmdline-tools/latest/bin/sdkmanager"
                break
              fi
            done
          fi

          if [ -z "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find /opt /usr/local "${HOME}" \
              -type f \
              -name sdkmanager \
              2>/dev/null \
              | head -n 1 || true)"
          fi

          if [ -z "${SDKMANAGER}" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          SDK_ROOT="$(cd "$(dirname "${SDKMANAGER}")/../../.." && pwd)"

          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}" >> "${GITHUB_PATH}"

          echo "Android SDK:"
          echo "${SDK_ROOT}"

      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${ANDROID_SDK_ROOT}" \
              -type f \
              -name sdkmanager \
              | head -n 1)"
          fi

          yes | "${SDKMANAGER}" --licenses >/dev/null || true

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          adb version
          aapt2 version
          cmake --version

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          test -x "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"

          test -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          test -d "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}"

      - name: Verify NOVA N10 structure
        working-directory: ${{ env.NOVA_N10_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -d app
          test -d core
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f core/build.gradle.kts -o -f core/build.gradle
          test -f app/src/main/cpp/CMakeLists.txt

          echo "Estrutura NOVA N10 OK."

      - name: Normalize Kotlin compatibility
        working-directory: ${{ env.NOVA_N10_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f build.gradle.kts ]; then
            if grep -q \
              'id("org.jetbrains.kotlin.android") version "2.0.21" apply false' \
              build.gradle.kts; then

              sed -i \
                's/id("org.jetbrains.kotlin.android") version "2.0.21" apply false/id("org.jetbrains.kotlin.android") version "2.2.21" apply false/' \
                build.gradle.kts

              echo "Kotlin 2.0.21 -> 2.2.21 aplicado na cópia de CI."
            fi
          fi

          grep -R \
            'org.jetbrains.kotlin.android' \
            build.gradle.kts \
            settings.gradle.kts \
            2>/dev/null || true

      - name: Verify Gradle configuration
        working-directory: ${{ env.NOVA_N10_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            help

      - name: Run unit tests
        working-directory: ${{ env.NOVA_N10_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Build Debug APK
        working-directory: ${{ env.NOVA_N10_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Build Release APK
        working-directory: ${{ env.NOVA_N10_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleRelease

      - name: Locate generated APKs
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_APK="$(find "${NOVA_N10_PROJECT}/app/build/outputs/apk" \
            -type f \
            -name '*debug*.apk' \
            | head -n 1)"

          RELEASE_APK="$(find "${NOVA_N10_PROJECT}/app/build/outputs/apk" \
            -type f \
            -name '*release*.apk' \
            | head -n 1)"

          if [ -z "${DEBUG_APK}" ]; then
            echo "::error::Debug APK não encontrado."
            find "${NOVA_N10_PROJECT}/app/build/outputs" \
              -type f \
              -print || true
            exit 1
          fi

          if [ -z "${RELEASE_APK}" ]; then
            echo "::error::Release APK não encontrado."
            find "${NOVA_N10_PROJECT}/app/build/outputs" \
              -type f \
              -print || true
            exit 1
          fi

          echo "DEBUG_APK=${DEBUG_APK}" >> "${GITHUB_ENV}"
          echo "RELEASE_APK=${RELEASE_APK}" >> "${GITHUB_ENV}"

          echo "DEBUG=${DEBUG_APK}"
          echo "RELEASE=${RELEASE_APK}"

      - name: Validate APK 16 KB zip alignment
        shell: bash
        run: |
          set -euo pipefail

          zipalign -v -c -P 16 4 "${DEBUG_APK}"
          zipalign -v -c -P 16 4 "${RELEASE_APK}"

      - name: Validate Debug APK signature
        shell: bash
        run: |
          set -euo pipefail

          apksigner verify \
            --verbose \
            "${DEBUG_APK}"

      - name: Extract APK native libraries
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${RUNNER_TEMP}/nova-apk-libs"
          mkdir -p "${RUNNER_TEMP}/nova-apk-libs"

          unzip -q \
            "${DEBUG_APK}" \
            'lib/*' \
            -d "${RUNNER_TEMP}/nova-apk-libs"

          find "${RUNNER_TEMP}/nova-apk-libs" \
            -type f \
            -name '*.so' \
            -print

      - name: Validate ELF 16 KB alignment
        shell: bash
        run: |
          set -euo pipefail

          READELF="$(find "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            -type f \
            -name llvm-readelf \
            | head -n 1)"

          if [ -z "${READELF}" ]; then
            echo "::error::llvm-readelf não encontrado."
            exit 1
          fi

          FAILED=0

          while IFS= read -r LIB; do
            echo
            echo "=== ${LIB} ==="

            OUTPUT="$("${READELF}" -lW "${LIB}")"

            echo "${OUTPUT}" | grep "LOAD" || true

            while IFS= read -r LINE; do
              ALIGN="$(echo "${LINE}" | awk '{print $NF}')"

              case "${ALIGN}" in
                2**12|2**13)
                  echo "::error::ELF LOAD desalinhado para 16 KB: ${ALIGN}"
                  FAILED=1
                  ;;
              esac
            done < <(echo "${OUTPUT}" | grep "LOAD" || true)

          done < <(
            find "${RUNNER_TEMP}/nova-apk-libs" \
              -type f \
              -name '*.so'
          )

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Validate native build outputs
        shell: bash
        run: |
          set -euo pipefail

          NATIVE_DIR="${NOVA_N10_PROJECT}/app/build/intermediates"

          if [ ! -d "${NATIVE_DIR}" ]; then
            echo "Nenhum diretório native intermediário encontrado."
            exit 0
          fi

          READELF="$(find "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" \
            -type f \
            -name llvm-readelf \
            | head -n 1)"

          FAILED=0

          while IFS= read -r LIB; do
            echo "Checking ${LIB}"

            OUTPUT="$("${READELF}" -lW "${LIB}")"

            while IFS= read -r LINE; do
              ALIGN="$(echo "${LINE}" | awk '{print $NF}')"

              case "${ALIGN}" in
                2**12|2**13)
                  echo "::error::Native ELF desalinhado: ${LIB} -> ${ALIGN}"
                  FAILED=1
                  ;;
              esac
            done < <(echo "${OUTPUT}" | grep "LOAD" || true)

          done < <(
            find "${NATIVE_DIR}" \
              -type f \
              -name '*.so' \
              2>/dev/null || true
          )

          if [ "${FAILED}" -ne 0 ]; then
            exit 1
          fi

      - name: Run project audits
        working-directory: ${{ env.NOVA_N10_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f tools/check_declarations.py ]; then
            python3 tools/check_declarations.py
          fi

          if [ -f tools/audit_repo.py ]; then
            python3 tools/audit_repo.py
          fi

      - name: Generate build report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/nova-report"

          {
            echo "NOVA N10 CI BUILD REPORT"
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "Ref: ${GITHUB_REF}"
            echo "Runner: ${RUNNER_OS}"
            echo "Java: ${JAVA_VERSION}"
            echo "Gradle: ${GRADLE_VERSION}"
            echo "Android API: ${ANDROID_API}"
            echo "Build Tools: ${ANDROID_BUILD_TOOLS}"
            echo "NDK: ${NDK_VERSION}"
            echo "CMake: ${CMAKE_VERSION}"
            echo
            echo "Project:"
            echo "${NOVA_N10_PROJECT}"
            echo
            echo "Debug APK:"
            echo "${DEBUG_APK}"
            echo
            echo "Release APK:"
            echo "${RELEASE_APK}"
          } > "${RUNNER_TEMP}/nova-report/build-report.txt"

          cat "${RUNNER_TEMP}/nova-report/build-report.txt"

      - name: Upload APKs and report
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-N10-APKs-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ env.DEBUG_APK }}
            ${{ env.RELEASE_APK }}
            ${{ runner.temp }}/nova-report/build-report.txt
