name: NOVA N10

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: nova-n10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"
  NDK_VERSION: "28.0.13004108"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build
        run: |
          gradle clean testDebugUnitTest assembleDebug assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

      - name: Validate native libraries
        shell: bash
        run: |
          set -e

          READ_ELF="$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          mkdir -p build/elf-check

          while IFS= read -r LIB; do
            NAME=$(basename "$LIB")

            unzip -p "$APK_PATH" "$LIB" \
              > "build/elf-check/$NAME"

            "$READ_ELF" \
              -l \
              "build/elf-check/$NAME"
          done < <(
            unzip -Z1 "$APK_PATH" | grep '\.so$' || true
          )

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-N10-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-N10-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NOVA-N10-Reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            build/**
          if-no-files-found: ignore
          retention-days: 30
