name: Build NEXORA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Make scripts executable
        run: |
          find tools -type f -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true

      - name: Check project
        run: |
          echo "=== PROJECT ==="
          pwd
          ls -la

          echo
          echo "=== ANDROID MODULES ==="
          find . -maxdepth 3 -name "build.gradle.kts" -print

          echo
          echo "=== SETTINGS ==="
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          elif [ -f settings.gradle ]; then
            cat settings.gradle
          else
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          echo
          echo "=== VERIFICATION MODULE ==="
          find android-java-verification -maxdepth 4 -type f | sort

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build verification APK
        run: |
          gradle :android-java-verification:assembleDebug --no-daemon

      - name: Show generated APK
        run: |
          echo "=== GENERATED APK ==="
          find android-java-verification/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload verification APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-java-verification-0.6.0
          path: android-java-verification/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload production launcher APK if generated
        uses: actions/upload-artifact@v4
        with:
          name: nexora-launcher-0.6.0
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore
