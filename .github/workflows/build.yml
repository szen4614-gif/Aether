name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Locate project
        shell: bash
        run: |
          set -eux
          PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -type f -name settings.gradle -print -quit | xargs -r dirname)"
          fi
          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle(.kts) não encontrado"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | head -300
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Verify project
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          pwd
          ls -la
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle

      - name: Build APK
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          gradle --version
          gradle clean testDebugUnitTest assembleDebug assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Validate APK
        shell: bash
        run: |
          set -eux
          APK="$(find "$PROJECT_DIR" -type f \( -name "*.apk" \) | head -1)"
          test -n "$APK"
          echo "APK encontrado: $APK"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Validate native libraries
        shell: bash
        run: |
          set -eux
          while IFS= read -r so; do
            echo "Verificando: $so"
            llvm-readelf -l "$so" | grep -E "LOAD|0x4000" || true
          done < <(find "$PROJECT_DIR" -type f -name "*.so")

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-N10-debug
          path: "**/*-debug.apk"
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-N10-release
          path: "**/*-release-unsigned.apk"
          if-no-files-found: warn
